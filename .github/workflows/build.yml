name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: "Enable debug mode"
        type: boolean
        required: false
        default: false

env:
  GO_VERSION: "1.24"
  RUST_VERSION: "stable"

jobs:
  build-linux:
    strategy:
      matrix:
        arch: [amd64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-ffi/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libx11-dev \
            libxkbfile-dev \
            libxtst-dev \
            libxdo-dev \
            libxi-dev \
            libpng-dev \
            libjpeg-dev \
            libxinerama-dev \
            libxcb-xkb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxrender-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libxkbcommon-dev

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install dependencies
        run: go mod download

      - name: Build Rust FFI library
        run: |
          cd rust-ffi
          cargo build --release
          cd ..
          mkdir -p lib
          cp rust-ffi/target/release/libmyreviser_ffi.a lib/

      - name: Build application with Fyne
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          # fyne package creates MyReviser.tar.xz for Linux
          fyne package --icon assets/icon.png --name MyReviser --release

          # Extract MyReviser.tar.xz
          tar -xf MyReviser.tar.xz

          # Find the binary in usr/local/bin (module name is myreviser-go)
          BINARY=$(find usr/local/bin -type f -executable | head -n 1)
          if [ -n "$BINARY" ]; then
            echo "Found binary: $BINARY"
            mv "$BINARY" myreviser-linux-${{ matrix.arch }}
          else
            echo "Error: No binary found"
            ls -la usr/local/bin/
            exit 1
          fi

          # Clean up
          rm -rf usr MyReviser.tar.xz

      - name: Create portable archive
        run: |
          mkdir -p dist/portable
          cp myreviser-linux-${{ matrix.arch }} dist/portable/myreviser
          chmod +x dist/portable/myreviser
          if [ -f assets/icon.png ]; then
            cp assets/icon.png dist/portable/
          fi
          tar -czf myreviser-linux-${{ matrix.arch }}.tar.gz -C dist/portable .

      - name: Create AppImage
        if: matrix.arch == 'amd64'
        run: |
          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Create AppDir structure with proper hierarchy
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary
          cp myreviser-linux-${{ matrix.arch }} AppDir/usr/bin/myreviser
          chmod +x AppDir/usr/bin/myreviser

          # Copy icon to proper location
          if [ -f assets/icon.png ]; then
            cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/myreviser.png
            # Also copy to root for compatibility
            cp assets/icon.png AppDir/myreviser.png
          fi

          # Create desktop entry in proper location
          cat > AppDir/usr/share/applications/myreviser.desktop <<'EOF'
          [Desktop Entry]
          Name=MyReviser
          Comment=AI-powered text revision tool
          Exec=myreviser
          Icon=myreviser
          Terminal=false
          Type=Application
          Categories=Utility;Office;
          StartupNotify=false
          EOF

          # Also copy desktop file to root (required by linuxdeploy)
          cp AppDir/usr/share/applications/myreviser.desktop AppDir/myreviser.desktop

          # Create AppImage with proper desktop integration
          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

          # Find and rename the generated AppImage (exclude linuxdeploy itself)
          APPIMAGE_FILE=$(find . -maxdepth 1 -name "*.AppImage" -type f ! -name "linuxdeploy-*" | head -n 1)
          if [ -n "$APPIMAGE_FILE" ]; then
            echo "Found AppImage: $APPIMAGE_FILE"
            mv "$APPIMAGE_FILE" myreviser-linux-${{ matrix.arch }}.AppImage
            chmod +x myreviser-linux-${{ matrix.arch }}.AppImage
          else
            echo "Error: AppImage file not found"
            echo "Available files:"
            ls -la *.AppImage 2>/dev/null || echo "No AppImage files found"
            exit 1
          fi

      - name: Create .deb package
        run: |
          mkdir -p dist/deb/DEBIAN
          mkdir -p dist/deb/usr/local/bin
          mkdir -p dist/deb/usr/share/applications
          mkdir -p dist/deb/usr/share/icons/hicolor/256x256/apps

          # Copy binary
          cp myreviser-linux-${{ matrix.arch }} dist/deb/usr/local/bin/myreviser
          chmod +x dist/deb/usr/local/bin/myreviser

          # Sanitize version for Debian (must start with digit)
          RAW_VERSION="${GITHUB_REF_NAME#v}"
          # If version doesn't start with digit, use 0.0.0 prefix
          if ! echo "$RAW_VERSION" | grep -q '^[0-9]'; then
            DEB_VERSION="0.0.0-${RAW_VERSION}"
          else
            DEB_VERSION="$RAW_VERSION"
          fi
          # Replace invalid chars with dash
          DEB_VERSION=$(echo "$DEB_VERSION" | sed 's/[^0-9a-zA-Z.]/-/g' | sed 's/^-//' | sed 's/-$//')
          # Fallback if empty
          [ -z "$DEB_VERSION" ] && DEB_VERSION="0.0.0-dev"
          echo "Debian version: $DEB_VERSION"

          # Create control file
          cat > dist/deb/DEBIAN/control <<EOF
          Package: myreviser
          Version: $DEB_VERSION
          Section: text
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: Paradoxe Ng <contact@pngwasi.me>
          Homepage: https://github.com/paradoxe35/myreviser
          Depends: libc6, libgl1, libx11-6, libxinerama1, libxtst6, libxdo3
          Description: AI-powered text revision tool with Rust FFI
           MyReviser is a system tray application that provides global hotkeys
           for instant text enhancement using AI providers (OpenAI, Claude, Gemini).
           .
           Features:
            - Global hotkeys for instant text revision (Ctrl+Alt+Space)
            - Multiple AI provider support (OpenAI, Claude, Gemini)
            - System tray integration for quick access
            - Configurable system prompts and character limits
            - Non-destructive clipboard management
           .
           Built with Go and Rust FFI for optimal cross-platform performance.
           .
           License: MIT
          EOF

          # Copy icon if exists
          if [ -f assets/icon.png ]; then
            mkdir -p dist/deb/usr/share/icons/hicolor/256x256/apps
            cp assets/icon.png dist/deb/usr/share/icons/hicolor/256x256/apps/myreviser.png

            # Also copy to pixmaps as fallback
            mkdir -p dist/deb/usr/share/pixmaps
            cp assets/icon.png dist/deb/usr/share/pixmaps/myreviser.png
          fi

          # Create desktop entry
          cat > dist/deb/usr/share/applications/myreviser.desktop <<EOF
          [Desktop Entry]
          Name=MyReviser
          Comment=AI-powered text revision tool
          Exec=/usr/local/bin/myreviser
          Icon=myreviser
          Terminal=false
          Type=Application
          Categories=Utility;Office;
          StartupNotify=false
          StartupWMClass=MyReviser
          EOF

          # Build deb package
          dpkg-deb --build dist/deb myreviser-linux-${{ matrix.arch }}.deb

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: myreviser-linux-${{ matrix.arch }}-portable
          path: myreviser-linux-${{ matrix.arch }}.tar.gz

      - name: Upload AppImage artifact
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: myreviser-linux-${{ matrix.arch }}-appimage
          path: myreviser-linux-${{ matrix.arch }}.AppImage

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: myreviser-linux-${{ matrix.arch }}-deb
          path: myreviser-linux-${{ matrix.arch }}.deb

  build-windows:
    strategy:
      matrix:
        arch: [amd64]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-ffi/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install MinGW
        run: |
          choco install mingw -y

      - name: Add Rust GNU target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install dependencies
        run: go mod download

      - name: Build Rust FFI library
        run: |
          cd rust-ffi
          cargo build --release --target x86_64-pc-windows-gnu
          cd ..
          New-Item -ItemType Directory -Force -Path lib
          Copy-Item rust-ffi\target\x86_64-pc-windows-gnu\release\libmyreviser_ffi.a lib\

      - name: Build application with Fyne
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: |
          fyne package --icon assets/icon.ico --name MyReviser --release
          # fyne package creates MyReviser.exe, rename it
          if (Test-Path "MyReviser.exe") {
            Move-Item MyReviser.exe myreviser-windows-${{ matrix.arch }}.exe
          }

      - name: Generate Windows README
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          @"
          MyReviser for Windows

          Thank you for installing MyReviser, the Fyne-powered AI text revision assistant.

          Getting Started:
          1. Launch myreviser.exe (or use the Start Menu shortcut).
          2. Right-click the tray icon to open Settings.
          3. Configure your AI provider (OpenAI, Claude, or Gemini) and hotkeys.

          Default Hotkeys:
          - Ctrl+Alt+Space: Revise all text.
          - Ctrl+Win: Revise selected text.

          Tips:
          - Enable "Start on login" from Settings > System to launch MyReviser automatically.
          - MyReviser runs from the system tray; use the tray menu to quit or update preferences.

          Support: https://github.com/paradoxe35/myreviser
          "@ | Out-File -FilePath dist\README.txt -Encoding UTF8

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\portable | Out-Null
          Copy-Item myreviser-windows-${{ matrix.arch }}.exe dist\portable\myreviser.exe -Force
          if (Test-Path "assets\icon.ico") {
            Copy-Item assets\icon.ico dist\portable\icon.ico -Force
          }
          if (Test-Path "dist\README.txt") {
            Copy-Item dist\README.txt dist\portable\README.txt -Force
          }
          Compress-Archive -Path dist\portable\* -DestinationPath myreviser-windows-${{ matrix.arch }}-portable.zip -Force

      - name: Create installer (NSIS)
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          choco install nsis -y
          $env:Path += ";C:\Program Files (x86)\NSIS"

          # Verify required files exist
          if (-not (Test-Path "myreviser-windows-${{ matrix.arch }}.exe")) {
            Write-Error "Source executable not found: myreviser-windows-${{ matrix.arch }}.exe"
            exit 1
          }
          if (-not (Test-Path "assets\icon.ico")) {
            Write-Warning "Icon file not found: assets\icon.ico - NSIS will fail"
          }

          $version = "${{ github.ref_name }}" -replace '^v','' -replace '[^0-9a-zA-Z.]','-'
          if ([string]::IsNullOrEmpty($version)) { $version = "0.0.0-dev" }

          # Create NSIS installer script
          @"
          Unicode true
          !include "MUI2.nsh"
          !include "nsDialogs.nsh"
          !include "LogicLib.nsh"

          !define PRODUCT_NAME "MyReviser"
          !define PRODUCT_VERSION "$version"
          !define PRODUCT_PUBLISHER "MyReviser Team"
          !define PRODUCT_WEB_SITE "https://github.com/paradoxe35/myreviser"
          !define PRODUCT_INSTALL_REG "Software\`${PRODUCT_PUBLISHER}\`${PRODUCT_NAME}"
          !define PRODUCT_UNINST_KEY "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${PRODUCT_NAME}"

          Name "`${PRODUCT_NAME}"
          OutFile "MyReviser-Setup.exe"
          InstallDir "`$LOCALAPPDATA\`${PRODUCT_NAME}"
          InstallDirRegKey HKCU "`${PRODUCT_INSTALL_REG}" "InstallDir"
          RequestExecutionLevel user
          SetCompress auto

          !define MUI_ABORTWARNING
          !define MUI_ICON "assets\icon.ico"
          !define MUI_UNICON "assets\icon.ico"

          Function .onInit
            SetShellVarContext current
          FunctionEnd

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !define MUI_FINISHPAGE_RUN "`$INSTDIR\myreviser.exe"
          !define MUI_FINISHPAGE_RUN_TEXT "Launch MyReviser now"
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_LANGUAGE "English"

          Section "MyReviser" SEC_APP
            SetOutPath "`$INSTDIR"
            File /oname=myreviser.exe "myreviser-windows-${{ matrix.arch }}.exe"
            File /nonfatal /oname=README.txt "dist\README.txt"
            File /nonfatal /oname=icon.ico "assets\icon.ico"

            Call RegisterApplication

            CreateDirectory "`$SMPROGRAMS\`${PRODUCT_NAME}"
            CreateShortcut "`$SMPROGRAMS\`${PRODUCT_NAME}\`${PRODUCT_NAME}.lnk" "`$INSTDIR\myreviser.exe"
            CreateShortcut "`$SMPROGRAMS\`${PRODUCT_NAME}\Uninstall `${PRODUCT_NAME}.lnk" "`$INSTDIR\Uninstall.exe"
            CreateShortcut "`$DESKTOP\`${PRODUCT_NAME}.lnk" "`$INSTDIR\myreviser.exe"
          SectionEnd

          Section "Uninstall"
            Call un.StopApplication

            Delete "`$INSTDIR\myreviser.exe"
            Delete "`$INSTDIR\README.txt"
            Delete "`$INSTDIR\icon.ico"
            Delete "`$INSTDIR\Uninstall.exe"
            RMDir "`$INSTDIR"

            Delete "`$DESKTOP\`${PRODUCT_NAME}.lnk"
            Delete "`$SMPROGRAMS\`${PRODUCT_NAME}\`${PRODUCT_NAME}.lnk"
            Delete "`$SMPROGRAMS\`${PRODUCT_NAME}\Uninstall `${PRODUCT_NAME}.lnk"
            RMDir "`$SMPROGRAMS\`${PRODUCT_NAME}"

            DeleteRegKey HKCU "`${PRODUCT_UNINST_KEY}"
            DeleteRegKey HKCU "`${PRODUCT_INSTALL_REG}"
          SectionEnd

          Function RegisterApplication
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "`${PRODUCT_UNINST_KEY}" "DisplayName" "`${PRODUCT_NAME}"
            WriteRegStr HKCU "`${PRODUCT_UNINST_KEY}" "UninstallString" "`$INSTDIR\Uninstall.exe"
            WriteRegStr HKCU "`${PRODUCT_UNINST_KEY}" "DisplayIcon" "`$INSTDIR\myreviser.exe"
            WriteRegStr HKCU "`${PRODUCT_UNINST_KEY}" "DisplayVersion" "`${PRODUCT_VERSION}"
            WriteRegStr HKCU "`${PRODUCT_UNINST_KEY}" "Publisher" "`${PRODUCT_PUBLISHER}"
            WriteRegStr HKCU "`${PRODUCT_UNINST_KEY}" "URLInfoAbout" "`${PRODUCT_WEB_SITE}"
            WriteRegStr HKCU "`${PRODUCT_UNINST_KEY}" "InstallLocation" "`$INSTDIR"
            WriteRegDWORD HKCU "`${PRODUCT_UNINST_KEY}" "NoModify" 1
            WriteRegDWORD HKCU "`${PRODUCT_UNINST_KEY}" "NoRepair" 1

            WriteRegStr HKCU "`${PRODUCT_INSTALL_REG}" "InstallDir" "`$INSTDIR"
            WriteRegStr HKCU "`${PRODUCT_INSTALL_REG}" "Version" "`${PRODUCT_VERSION}"
          FunctionEnd

          Function un.StopApplication
            nsExec::ExecToStack 'taskkill /F /IM myreviser.exe'
            Pop `$0
          FunctionEnd
          "@ | Out-File -FilePath installer.nsi -Encoding UTF8

          Write-Host "NSIS script created, contents:"
          Get-Content installer.nsi | Select-Object -First 20
          Write-Host "..."
          Get-Content installer.nsi | Select-Object -Last 20

          Write-Host "`nCompiling NSIS installer..."
          makensis installer.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NSIS compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

          if (Test-Path "MyReviser-Setup.exe") {
            Write-Host "Installer created successfully"
            Move-Item MyReviser-Setup.exe myreviser-windows-${{ matrix.arch }}-installer.exe -Force
          } else {
            Write-Error "MyReviser-Setup.exe was not created by NSIS"
            exit 1
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: myreviser-windows-${{ matrix.arch }}-portable
          path: myreviser-windows-${{ matrix.arch }}-portable.zip

      - name: Upload installer artifact
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: myreviser-windows-${{ matrix.arch }}-installer
          path: myreviser-windows-${{ matrix.arch }}-installer.exe

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: myreviser-windows-${{ matrix.arch }}-exe
          path: myreviser-windows-${{ matrix.arch }}.exe

  build-macos:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ env.RUST_VERSION }}
          override: true

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust-ffi/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Add Rust target for architecture
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            rustup target add aarch64-apple-darwin
          else
            rustup target add x86_64-apple-darwin
          fi

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Install dependencies
        run: go mod download

      - name: Build Rust FFI library
        run: |
          mkdir -p lib
          cd rust-ffi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cargo build --release --target aarch64-apple-darwin
            cp target/aarch64-apple-darwin/release/libmyreviser_ffi.a ../lib/
          else
            cargo build --release --target x86_64-apple-darwin
            cp target/x86_64-apple-darwin/release/libmyreviser_ffi.a ../lib/
          fi

      - name: Build application with Fyne
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
        run: |
          fyne package --icon assets/icon.png --name MyReviser --app-id me.pngwasi.myreviser --release

      - name: Verify .app bundle created
        run: |
          if [ ! -d "MyReviser.app" ]; then
            echo "Error: MyReviser.app was not created"
            ls -la
            exit 1
          fi
          echo "MyReviser.app created successfully"

      - name: Verify Info.plist
        run: |
          # Verify Info.plist exists and is valid
          echo "Info.plist contents:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" MyReviser.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" MyReviser.app/Contents/Info.plist

      - name: Ad-hoc sign app bundle (inside-out approach)
        run: |
          echo "Ad-hoc signing MyReviser.app (without hardened runtime/entitlements)..."

          # Determine actual executable name from Info.plist
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" MyReviser.app/Contents/Info.plist)
          echo "CFBundleExecutable=$EXEC"

          # Sign from inside-out (Apple best practice):
          # 1. Sign any nested frameworks first (if they exist)
          echo "Signing frameworks (if any)..."
          find MyReviser.app/Contents/Frameworks -name "*.framework" -exec codesign --force --sign - {} \; 2>/dev/null || true

          # 2. Sign the main executable
          echo "Signing executable: ${EXEC}"
          codesign --force --sign - "MyReviser.app/Contents/MacOS/${EXEC}"

          # 3. Sign the entire app bundle (without --deep since contents already signed)
          echo "Signing app bundle..."
          codesign --force --sign - MyReviser.app

          # Verify the signature
          echo "Verifying signature..."
          codesign --verify --verbose=4 MyReviser.app

          echo "Ad-hoc signing completed successfully"

      - name: Remove quarantine attributes
        run: |
          # Remove quarantine attribute to prevent "damaged" error
          xattr -cr MyReviser.app || true

      - name: Create installation README
        run: |
          cat > INSTALL_MACOS.txt <<'EOF'
          MyReviser for macOS - Installation Instructions

          FIRST LAUNCH:

          When you first open MyReviser, you'll see a security warning:
          "MyReviser cannot be opened because it is from an unidentified developer"

          METHOD 1 (Recommended):
          1. Right-click (or Control+click) MyReviser.app
          2. Select "Open" from the menu
          3. Click "Open" in the security dialog
          4. MyReviser will launch and appear in your menu bar (tray icon)

          METHOD 2 (System Settings):
          1. Try to open MyReviser normally (it will be blocked)
          2. Go to System Settings > Privacy & Security
          3. Look for "MyReviser was blocked" message
          4. Click "Open Anyway"
          5. Click "Open" in the confirmation dialog

          METHOD 3 (Terminal - if above methods don't work):
          1. Open Terminal (Applications > Utilities > Terminal)
          2. Type: xattr -cr
          3. Drag MyReviser.app into Terminal window
          4. Press Enter
          5. Open MyReviser normally

          IMPORTANT:
          - MyReviser runs in the menu bar (no Dock icon)
          - Grant Accessibility permissions when prompted for global hotkeys
          - After first launch, it will open normally

          Support: https://github.com/paradoxe35/myreviser
          EOF

      - name: Create ZIP archive
        run: |
          # Create zip without extended attributes to avoid Gatekeeper issues
          zip -r -X myreviser-darwin-${{ matrix.arch }}.zip MyReviser.app INSTALL_MACOS.txt

      - name: Create DMG
        run: |
          # Install create-dmg
          brew install create-dmg || true

          # Create DMG - allow failure if create-dmg has issues
          if create-dmg \
            --volname "MyReviser" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "MyReviser.app" 175 120 \
            --hide-extension "MyReviser.app" \
            --app-drop-link 425 120 \
            --no-internet-enable \
            "myreviser-darwin-${{ matrix.arch }}.dmg" \
            "MyReviser.app"; then
            echo "DMG created successfully"
          else
            echo "Warning: DMG creation failed, but ZIP archive is available"
          fi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: myreviser-darwin-${{ matrix.arch }}-zip
          path: myreviser-darwin-${{ matrix.arch }}.zip

      - name: Upload DMG artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: myreviser-darwin-${{ matrix.arch }}-dmg
          path: myreviser-darwin-${{ matrix.arch }}.dmg
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          # Move all artifacts to release folder
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) -exec cp {} release/ \;

          # Create checksums
          cd release
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body: |
            MyReviser ${{ github.ref_name }}

            AI-powered text revision tool with global hotkeys and multi-provider support.

            ## Downloads

            **Windows**
            - Portable (x64): `myreviser-windows-amd64-portable.zip`
            - Installer (x64): `myreviser-windows-amd64-installer.exe`

            **macOS**
            - Intel (x64): `myreviser-darwin-amd64.dmg`
            - Apple Silicon (ARM64): `myreviser-darwin-arm64.dmg`

            **Linux**
            - Portable (x64): `myreviser-linux-amd64.tar.gz`
            - AppImage (x64): `myreviser-linux-amd64.AppImage`
            - Debian/Ubuntu (x64): `myreviser-linux-amd64.deb`

            Verify downloads with `checksums.txt`.

            ## Installation

            **Windows**: Run installer or extract portable ZIP

            **macOS**:
            1. Download and extract ZIP or open DMG
            2. First launch: Right-click MyReviser.app > Open > Click "Open"
            3. Or go to System Settings > Privacy & Security > Click "Open Anyway"
            4. MyReviser appears in menu bar (no Dock icon)
            5. Grant Accessibility permissions when prompted

            **Linux**:
            ```bash
            # AppImage
            chmod +x myreviser-linux-amd64.AppImage
            ./myreviser-linux-amd64.AppImage

            # Debian/Ubuntu
            sudo dpkg -i myreviser-linux-amd64.deb
            ```

            ## Quick Start

            1. Launch MyReviser (appears in system tray)
            2. Right-click tray icon > Settings
            3. Configure AI provider (OpenAI, Claude, or Gemini)
            4. Set hotkeys (optional)
            5. Use global hotkeys to revise text

            ## Default Hotkeys

            - Select All & Revise: `Ctrl+Alt+Space` (Linux/Windows), `Cmd+Option+Space` (macOS)
            - Revise Selection: `Ctrl+Super` (Linux), `Ctrl+Win` (Windows), `Ctrl+Cmd` (macOS)

            ## Requirements

            **Linux**: X11, OpenGL (libgl1), libX11, libXtst
            **macOS**: macOS 10.13+, accessibility permissions required
            **Windows**: Windows 10+

            ## Technical Details

            Built with Go 1.24 + Rust FFI (rdev, arboard, enigo) for optimal performance.

            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
            Visit [GitHub](https://github.com/paradoxe35/myreviser) for documentation.
          draft: false
          prerelease: false
          generate_release_notes: true
